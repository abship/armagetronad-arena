<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Arena Grid — upstream feasibility client</title>
  <style>
    html, body { height: 100%; margin: 0; background: #05070b; color: #dce8ff; }
    body { display: grid; place-items: center; overflow: hidden; font: 14px system-ui, sans-serif; }
    canvas { width: min(100vw, 1280px); height: min(100vh, 720px); outline: none; }
  </style>
</head>
<body>
  <canvas id="canvas" width="1280" height="720" tabindex="0"
    role="application" aria-label="Arena Grid game canvas"
    oncontextmenu="event.preventDefault()"></canvas>
  <script>
    window.__arenaErrors = [];
    window.__arenaRecordError = function(value) {
      var message = String(value || 'browser runtime error')
        .replace(/([?&]ticket=)[^&#\s]+/g, '$1[redacted]')
        .replace(/arena-auth-[A-Za-z0-9_.-]+/g, 'arena-auth-[redacted]')
        .slice(0, 1000);
      window.__arenaErrors.push(message);
      if (window.__arenaErrors.length > 32) window.__arenaErrors.shift();
    };
    window.addEventListener('error', function(event) {
      window.__arenaRecordError(
        event.error && event.error.stack ? event.error.stack : event.message || 'window error'
      );
    });
    window.addEventListener('unhandledrejection', function(event) {
      window.__arenaRecordError(
        event.reason && event.reason.stack ? event.reason.stack : event.reason || 'unhandled rejection'
      );
    });
  </script>
  {{{ SCRIPT }}}
</body>
</html>
