name: Arena same-source reproducibility

on:
  pull_request:
    branches:
      - arena/stable-0.2.9.3.0
  workflow_dispatch:

permissions:
  contents: read

env:
  ARENA_CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  reproducibility-linux-amd64:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out exact candidate history
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          fetch-depth: 0
          ref: ${{ env.ARENA_CANDIDATE_SHA }}

      - name: Verify exact ARM-1 base and protected semantic diff
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$ARENA_CANDIDATE_SHA"
          test "$(git rev-parse 'v0.2.9.3.0^{}')" = 036daaf34f055b1efbcee6a4afc4d90a325ce569
          ./arena/check-prediction-telemetry-diff.sh

      - name: Build twice and compare release bytes
        run: ./arena/reproducibility-check.sh --platform linux/amd64

      - name: Check patch whitespace
        if: always()
        run: git diff --check

      - name: Upload exact-source release and reproducibility evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: arena-linux-amd64-reproducibility
          path: |
            build/reproducibility/
            build/release/
          if-no-files-found: warn
          retention-days: 30
